<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>幼兒版 Spot It - 找找看</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Cute font -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Confetti for rewards -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #FFFBEB; /* Soft Yellow */
            overscroll-behavior: none;
            touch-action: manipulation;
        }
        
        .game-title {
            font-family: 'Fredoka One', cursive;
            text-shadow: 2px 2px 0px #FCD34D;
        }

        /* Card Animation */
        .card-enter {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Correct Match Animation */
        .match-success {
            animation: bounce 0.5s infinite;
            filter: drop-shadow(0 0 10px gold);
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.4); }
        }

        /* Wrong Match Animation */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        /* Emoji Button Styles */
        .emoji-btn {
            transition: transform 0.2s;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        .emoji-btn:active {
            transform: scale(0.9);
        }

        .emoji-float {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-yellow-50 min-h-screen overflow-hidden flex flex-col">

    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        // --- 遊戲資料與邏輯 ---

        // 定義不同的圖案主題 (每個主題需至少 21 個圖案)
        const THEMES = {
            animals: {
                id: 'animals',
                name: "可愛動物",
                icon: "🐶",
                pool: [
                    "🐶", "🐱", "🐭", "🐹", "🐰", 
                    "🦊", "🐻", "🐼", "🐨", "🐯", 
                    "🦁", "🐮", "🐷", "🐸", "🐵", 
                    "🐔", "🐧", "🐦", "🐤", "🦆", 
                    "🐝"
                ]
            },
            fruits: {
                id: 'fruits',
                name: "美味蔬果",
                icon: "🍎",
                pool: [
                    "🍎", "🍐", "🍊", "🍌", "🍉", 
                    "🍇", "🍓", "🫐", "🍒", "🍑", 
                    "🥭", "🍍", "🥝", "🍅", "🍆", 
                    "🥑", "🥦", "🌽", "🥕", "🍄", 
                    "🥜"
                ]
            },
            objects: {
                id: 'objects',
                name: "生活物品",
                icon: "🚗",
                pool: [
                    "🚗", "🚓", "🚑", "🚒", "🚲", 
                    "🚂", "✈️", "🚀", "🚁", "⚽", 
                    "🏀", "⚾", "🎾", "🎸", "🎺", 
                    "🎻", "🥁", "⌚", "📷", "📺", 
                    "🎈"
                ]
            }
        };

        // 不同難度的數學模型
        const GAME_MODES = {
            3: {
                name: "簡單",
                desc: "3 個圖案",
                icon: "🐣",
                fontSize: "4.5rem",
                data: [ // Order 2 (Fano Plane) - 7 cards, 7 symbols
                    [0,1,2], [0,3,4], [0,5,6], 
                    [1,3,5], [1,4,6], 
                    [2,3,6], [2,4,5]
                ]
            },
            4: {
                name: "中等",
                desc: "4 個圖案",
                icon: "🐰",
                fontSize: "4rem",
                data: [ // Order 3 - 13 cards, 13 symbols
                    [0,1,2,3],
                    [0,4,5,6], [0,7,8,9], [0,10,11,12],
                    [1,4,7,10], [1,5,8,11], [1,6,9,12],
                    [2,4,8,12], [2,5,9,10], [2,6,7,11],
                    [3,4,9,11], [3,5,7,12], [3,6,8,10]
                ]
            },
            5: {
                name: "挑戰",
                desc: "5 個圖案",
                icon: "🦁",
                fontSize: "3.5rem",
                data: [ // Order 4 - 21 cards, 21 symbols (Verified)
                    [0, 1, 2, 3, 4],
                    [0, 5, 6, 7, 8], [0, 9, 10, 11, 12], [0, 13, 14, 15, 16], [0, 17, 18, 19, 20],
                    [1, 5, 9, 13, 17], [1, 6, 10, 14, 18], [1, 7, 11, 15, 19], [1, 8, 12, 16, 20],
                    [2, 5, 10, 15, 20], [2, 6, 9, 16, 19], [2, 7, 12, 13, 18], [2, 8, 11, 14, 17],
                    [3, 5, 11, 16, 18], [3, 6, 12, 15, 17], [3, 7, 9, 14, 20], [3, 8, 10, 13, 19],
                    [4, 5, 12, 14, 19], [4, 6, 11, 13, 20], [4, 7, 10, 16, 17], [4, 8, 9, 15, 18]
                ]
            }
        };

        // 輔助函式：洗牌
        const shuffle = (array) => {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        };

        // 輔助函式：產生隨機旋轉與位置微調
        const getRandomStyle = (index, total, baseFontSize) => {
            // 基礎位置演算法
            let top = 50;
            let left = 50;
            let radius = 32; 

            // 根據圖案數量調整佈局半徑
            if (total === 3) radius = 25;
            if (total === 4) radius = 30;

            if (index > 0) {
                // 第一個放中間，剩下的圍一圈
                // total - 1 個在外圈
                const slice = 360 / (total - 1);
                const angle = ((index - 1) * slice) * (Math.PI / 180);
                top = 50 + radius * Math.sin(angle);
                left = 50 + radius * Math.cos(angle);
            }

            // 加入隨機偏移
            const randomOffset = 5; 
            top += (Math.random() * randomOffset * 2) - randomOffset;
            left += (Math.random() * randomOffset * 2) - randomOffset;

            // 隨機旋轉
            const rotate = Math.floor(Math.random() * 360);
            // 隨機大小 (0.85 ~ 1.15倍) - 縮小變異範圍避免重疊
            const scale = 0.85 + Math.random() * 0.3;

            return {
                top: `${top}%`,
                left: `${left}%`,
                transform: `translate(-50%, -50%) rotate(${rotate}deg) scale(${scale})`,
                fontSize: baseFontSize
            };
        };

        // --- 元件 ---

        const Card = ({ symbols, onSymbolClick, isTarget, highlight, fontSize }) => {
            const layoutStyles = React.useMemo(() => {
                return symbols.map((_, idx) => getRandomStyle(idx, symbols.length, fontSize));
            }, [symbols, fontSize]);

            return (
                <div className={`relative bg-white rounded-full shadow-xl border-4 border-yellow-200 card-enter
                    w-64 h-64 md:w-80 md:h-80 flex-shrink-0 mx-auto transition-all duration-300
                    ${isTarget ? 'bg-blue-50' : ''}`}
                >
                    {symbols.map((symbol, idx) => (
                        <div
                            key={idx}
                            className={`emoji-float emoji-btn hover:scale-110
                                ${highlight === symbol ? 'match-success' : ''}`}
                            style={layoutStyles[idx]}
                            onClick={(e) => {
                                e.stopPropagation();
                                onSymbolClick(symbol);
                            }}
                        >
                            {symbol}
                        </div>
                    ))}
                </div>
            );
        };

        const ThemeButton = ({ theme, isSelected, onClick }) => (
            <button 
                onClick={onClick}
                className={`flex flex-col items-center justify-center p-3 rounded-2xl transition-all w-28 md:w-32
                    ${isSelected 
                        ? 'bg-yellow-200 border-4 border-yellow-400 shadow-inner scale-95' 
                        : 'bg-white border-2 border-yellow-100 shadow-md hover:scale-105'}`}
            >
                <div className="text-4xl mb-1">{theme.icon}</div>
                <div className={`font-bold ${isSelected ? 'text-yellow-800' : 'text-gray-600'}`}>
                    {theme.name}
                </div>
            </button>
        );

        const DifficultyButton = ({ mode, count, onClick }) => (
            <button 
                onClick={onClick}
                className="group relative flex flex-col items-center justify-center bg-white border-4 border-yellow-300 rounded-3xl p-4 w-full md:w-48 shadow-lg hover:shadow-xl hover:border-yellow-400 hover:scale-105 transition-all active:scale-95"
            >
                <div className="text-5xl mb-2 group-hover:scale-110 transition-transform">{mode.icon}</div>
                <div className="text-xl font-bold text-gray-700">{mode.name}</div>
                <div className="text-sm text-gray-400 font-bold">{count} 個圖案</div>
            </button>
        );

        const App = () => {
            const [gameState, setGameState] = React.useState('menu'); // menu, playing, end
            const [currentThemeId, setCurrentThemeId] = React.useState('animals'); // animals, fruits, objects
            const [difficulty, setDifficulty] = React.useState(3); // 3, 4, 5
            
            const [score, setScore] = React.useState(0);
            const [deck, setDeck] = React.useState([]);
            const [currentCardIdx, setCurrentCardIdx] = React.useState(0);
            const [shake, setShake] = React.useState(false);
            const [highlight, setHighlight] = React.useState(null);
            const [showError, setShowError] = React.useState(false);
            const [emojiMap, setEmojiMap] = React.useState([]);

            const startGame = (selectedDifficulty) => {
                setDifficulty(selectedDifficulty);
                
                // 1. 根據選擇的主題獲取 Emoji 池
                const currentPool = THEMES[currentThemeId].pool;
                
                // 2. 隨機打亂 Emoji
                const shuffledEmojis = shuffle([...currentPool]);
                setEmojiMap(shuffledEmojis);

                // 3. 根據難度獲取並打亂牌庫
                const gameData = GAME_MODES[selectedDifficulty].data;
                const shuffledDeck = shuffle([...gameData]); 
                
                setDeck(shuffledDeck);
                setCurrentCardIdx(0);
                setScore(0);
                setGameState('playing');
                setHighlight(null);
                setShowError(false);
            };

            const handleMatch = (symbol) => {
                if (gameState !== 'playing') return;
                
                const cardA = deck[currentCardIdx];
                const cardB = deck[currentCardIdx + 1];

                const symbolIndex = emojiMap.indexOf(symbol);
                
                if (cardA.includes(symbolIndex) && cardB.includes(symbolIndex)) {
                    setHighlight(symbol);
                    setShowError(false);
                    
                    confetti({
                        particleCount: 50,
                        spread: 60,
                        origin: { y: 0.6 },
                        colors: ['#FCD34D', '#F87171', '#60A5FA', '#34D399']
                    });

                    setTimeout(() => {
                        setScore(s => s + 1);
                        setHighlight(null);
                        
                        if (currentCardIdx + 2 >= deck.length) {
                            endGame();
                        } else {
                            setCurrentCardIdx(c => c + 1);
                        }
                    }, 800);

                } else {
                    setShake(true);
                    setShowError(true);
                    setTimeout(() => setShake(false), 500);
                    setTimeout(() => setShowError(false), 1500);
                }
            };

            const endGame = () => {
                setGameState('end');
                setShowError(false);
                confetti({
                    particleCount: 150,
                    spread: 100,
                    origin: { y: 0.6 }
                });
            };

            const goToMenu = () => {
                setGameState('menu');
                setScore(0);
            };

            // 準備當前卡片數據
            let cardASymbols = [], cardBSymbols = [];
            if (gameState === 'playing' && deck.length > 0) {
                const cardAData = deck[currentCardIdx] || [];
                const cardBData = deck[currentCardIdx + 1] || [];
                cardASymbols = cardAData.map(i => emojiMap[i]);
                cardBSymbols = cardBData.map(i => emojiMap[i]);
            }

            return (
                <div className="flex flex-col h-full max-w-4xl mx-auto w-full p-4 relative">
                    
                    {/* Error Overlay */}
                    {showError && (
                        <div className="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 pointer-events-none">
                            <div className="bg-red-400 text-white px-8 py-4 rounded-3xl text-2xl md:text-3xl font-bold shadow-2xl border-4 border-white animate-bounce whitespace-nowrap">
                                ❌ 答錯了！再試試看
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="flex justify-between items-center mb-4 min-h-[60px]">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={goToMenu}>
                            <h1 className="text-2xl md:text-3xl text-yellow-600 game-title">
                                幼兒版 Spot It
                            </h1>
                            <span className="text-2xl">{THEMES[currentThemeId].icon}</span>
                        </div>
                        
                        {gameState !== 'menu' && (
                            <div className="bg-white px-4 py-2 rounded-full shadow-md text-yellow-600 font-bold text-xl">
                                得分: {score}
                            </div>
                        )}
                    </header>

                    {/* Main Game Area */}
                    <main className="flex-grow flex flex-col justify-center items-center relative w-full">
                        
                        {/* 1. 選單畫面 */}
                        {gameState === 'menu' && (
                            <div className="text-center space-y-8 animate-fade-in w-full max-w-3xl">
                                
                                {/* 主題選擇區 */}
                                <div className="space-y-4">
                                    <h2 className="text-xl font-bold text-gray-500">第一步：選擇圖案</h2>
                                    <div className="flex flex-wrap gap-4 justify-center">
                                        {Object.values(THEMES).map(theme => (
                                            <ThemeButton 
                                                key={theme.id}
                                                theme={theme}
                                                isSelected={currentThemeId === theme.id}
                                                onClick={() => setCurrentThemeId(theme.id)}
                                            />
                                        ))}
                                    </div>
                                </div>

                                <div className="w-full h-1 bg-yellow-100 rounded-full mx-auto max-w-xs"></div>

                                {/* 難度選擇區 */}
                                <div className="space-y-4">
                                    <h2 className="text-xl font-bold text-gray-500">第二步：選擇難度開始</h2>
                                    <div className="flex flex-col md:flex-row gap-4 justify-center items-center px-4">
                                        <DifficultyButton mode={GAME_MODES[3]} count={3} onClick={() => startGame(3)} />
                                        <DifficultyButton mode={GAME_MODES[4]} count={4} onClick={() => startGame(4)} />
                                        <DifficultyButton mode={GAME_MODES[5]} count={5} onClick={() => startGame(5)} />
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2. 遊戲畫面 */}
                        {gameState === 'playing' && (
                            <div className={`flex flex-col md:flex-row gap-6 md:gap-16 w-full items-center justify-center ${shake ? 'shake' : ''}`}>
                                <div className="relative group">
                                    <Card 
                                        symbols={cardASymbols} 
                                        onSymbolClick={handleMatch}
                                        isTarget={true}
                                        highlight={highlight}
                                        fontSize={GAME_MODES[difficulty].fontSize}
                                    />
                                </div>

                                <div className="relative">
                                    <Card 
                                        symbols={cardBSymbols} 
                                        onSymbolClick={handleMatch}
                                        isTarget={false}
                                        highlight={highlight}
                                        fontSize={GAME_MODES[difficulty].fontSize}
                                    />
                                </div>
                            </div>
                        )}

                        {/* 3. 結束畫面 */}
                        {gameState === 'end' && (
                            <div className="text-center bg-white p-8 rounded-3xl shadow-xl space-y-6 fade-in max-w-sm w-full mx-4">
                                <div className="text-6xl">🎉</div>
                                <h2 className="text-3xl font-bold text-yellow-600">太棒了！</h2>
                                <p className="text-xl text-gray-500">你完成了 {GAME_MODES[difficulty].name} 挑戰！</p>
                                <div className="text-lg text-yellow-600 font-bold bg-yellow-50 py-2 rounded-lg">
                                    總共 {score} 組配對
                                </div>
                                
                                <div className="flex flex-col gap-3 pt-4">
                                    <button 
                                        onClick={() => startGame(difficulty)}
                                        className="bg-green-400 hover:bg-green-500 text-white text-xl font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:scale-105 active:scale-95 w-full"
                                    >
                                        再玩一次 🔄
                                    </button>
                                    <button 
                                        onClick={goToMenu}
                                        className="bg-white border-2 border-gray-200 text-gray-400 font-bold py-2 px-8 rounded-full hover:bg-gray-50 hover:text-gray-600 transition w-full"
                                    >
                                        回主選單 🏠
                                    </button>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Footer Instructions */}
                    <footer className="mt-4 text-center text-gray-400 text-sm">
                        <p>專為幼兒設計 • 訓練觀察力</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
